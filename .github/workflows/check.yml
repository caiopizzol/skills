name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
  production-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --production --frozen-lockfile
      - run: bun run install:skills -- "$RUNNER_TEMP/skills" read-video
      - run: bun run text-tools inspect packages/text-tools/tests/fixtures/files/fixture-text.txt
